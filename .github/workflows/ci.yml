name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  mmddumper:
    name: MMDDumper Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python runner test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Test MMDDumper Python runner
        run: python -m pytest tools/mmd-oracle-runner

  checks:
    name: Workspace checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check lightweight builds
        run: |
          cargo check -p mmd-anim-physics-bullet --no-default-features
          cargo test -p mmd-anim-cli -p mmd-anim-ffi --no-default-features

  python-ffi:
    name: Python FFI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run shared native Python/C ABI release gate (Unix)
        if: runner.os != 'Windows'
        run: python tools/check_python_ffi_release.py

      - name: Run shared native Python/C ABI release gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw 'Visual Studio with the x64 C++ toolchain was not found.'
          }
          & (Join-Path $installPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python tools/check_python_ffi_release.py
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
