[workspace]
members = ["core", "native", "wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.87"
license = "MIT"
publish = false

[workspace.dependencies]
aes-gcm = "0.10.3"
getrandom = { version = "0.2.17", features = ["js"] }
ring = "0.17.14"
ruzstd = "0.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
wasm-bindgen = "0.2.122"
zstd = "0.13.3"
