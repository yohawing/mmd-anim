<!doctype html>
<meta charset="utf-8">
<title>MMDPACK official Firefox WebGPU probe</title>
<script type="importmap">{"imports":{"three":"/three/build/three.webgpu.js"}}</script>
<button id="run">Run official Firefox WebGPU</button>
<pre id="status">Ready: official Firefox WebGPU only.</pre>
<script>
const statusNode = document.querySelector('#status');
statusNode.textContent = 'Bootstrapping…';
addEventListener('error', event => statusNode.textContent = `MODULE FAILED: ${event.message}`);
addEventListener('unhandledrejection', event => statusNode.textContent = `REJECTION: ${event.reason}`);
</script>
<script type="module">
import('/probe-webgpu.js?v=2').then(() => statusNode.textContent = 'Ready: official Firefox WebGPU only.')
  .catch(error => statusNode.textContent = `IMPORT FAILED: ${error.stack || error}`);
</script>
