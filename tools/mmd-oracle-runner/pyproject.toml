[project]
name = "mmd-oracle-runner"
version = "0.1.0"
description = "Validation foundation for the mmd-anim MMD oracle runner"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = []

[project.scripts]
mmd-oracle-runner = "mmd_oracle_runner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: execute repository-local backend preparation without launching MMD",
]
